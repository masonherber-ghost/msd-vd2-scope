document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"528f7ce0-6986-4227-9337-91328bda444b\"><\u002Fscript>\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>/* MSD Foundations — Header explorations\n   Design tokens drawn from the Figma file's metadata + observed component values. */\n\n:root {\n  /* Brand */\n  --c-primary-900: rgb(19, 66, 118);     /* primary navy — text + brand */\n  --c-primary-700: rgb(58, 84, 161);\n  --c-primary-500: rgb(1, 122, 201);     /* link blue */\n  --c-primary-400: rgb(0, 113, 187);     /* utility link blue */\n  --c-primary-300: rgb(103, 175, 223);\n  --c-primary-200: rgb(191, 222, 241);\n  --c-primary-100: rgb(217, 235, 247);\n  --c-primary-75:  rgb(213, 231, 239);\n  --c-primary-50:  rgb(230, 242, 250);\n  --c-primary-25:  rgb(245, 250, 253);\n\n  /* Accent */\n  --c-teal:    rgb(53, 192, 186);\n  --c-coral:   rgb(247, 92, 88);\n  --c-amber:   rgb(253, 178, 2);\n  --c-purple:  rgb(138, 56, 245);\n\n  /* Neutrals */\n  --c-ink-900: rgb(22, 44, 69);\n  --c-ink-700: rgb(51, 51, 51);\n  --c-ink-500: rgb(102, 102, 102);\n  --c-ink-300: rgb(161, 179, 200);\n  --c-ink-250: rgb(113, 142, 173);\n  --c-line:    rgb(208, 217, 228);\n  --c-line-2:  rgb(217, 217, 217);\n  --c-bg:      rgb(255, 255, 255);\n  --c-bg-soft: rgb(245, 250, 253);\n\n  /* Shadows */\n  --shadow-header: 0 2px 8px 0 rgba(22, 44, 69, 0.2);\n  --shadow-menu:   0 8px 24px 0 rgba(22, 44, 69, 0.18);\n\n  /* Type */\n  --font-sans: \"Atkinson Hyperlegible Next\", \"Atkinson Hyperlegible\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n\n  /* Spacing scale */\n  --sp-1: 4px;\n  --sp-2: 8px;\n  --sp-3: 12px;\n  --sp-4: 16px;\n  --sp-5: 20px;\n  --sp-6: 24px;\n  --sp-8: 32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n\n  /* Radii */\n  --r-sm: 4px;\n  --r-md: 8px;\n  --r-lg: 16px;\n  --r-pill: 999px;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  font-family: var(--font-sans);\n  color: var(--c-ink-700);\n  background: var(--c-bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nbutton { font-family: inherit; }\n\n/* ============================================================\n   HEADER PRIMITIVES\n   ============================================================ */\n\n/* Wordmark (original placeholder for myMSD-new) */\n.brand {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  text-decoration: none;\n  color: var(--c-primary-900);\n  flex: 0 0 auto;\n}\n.brand__symbol {\n  width: 36px;\n  height: 36px;\n  flex-shrink: 0;\n}\n.brand--lg .brand__symbol { width: 44px; height: 44px; }\n.brand--sm .brand__symbol { width: 32px; height: 32px; }\n\n.brand__wordmark {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  font-size: 22px;\n  letter-spacing: -0.01em;\n  line-height: 1;\n  color: var(--c-primary-900);\n  display: inline-flex;\n  align-items: baseline;\n  gap: 4px;\n}\n.brand--lg .brand__wordmark { font-size: 26px; }\n.brand--sm .brand__wordmark { font-size: 20px; }\n\n.brand__wordmark .light { font-weight: 400; }\n\n.brand__badge {\n  background: var(--c-teal);\n  color: white;\n  font-weight: 700;\n  font-size: 11px;\n  letter-spacing: 0.08em;\n  padding: 2px 8px;\n  border-radius: var(--r-pill);\n  margin-left: 6px;\n  line-height: 1.4;\n}\n\n/* ============================================================\n   HEADER SHELL\n   ============================================================ */\n.header {\n  position: relative;\n  background: var(--c-bg);\n  border-bottom: 2px solid var(--c-line);\n  box-shadow: var(--shadow-header);\n  font-family: var(--font-sans);\n}\n\n/* utility bar (top — external links) */\n.header__utility {\n  background: linear-gradient(to bottom, var(--c-primary-25) 25%, var(--c-primary-100) 100%);\n  border-bottom: 1px solid var(--c-line);\n  display: flex;\n  justify-content: flex-end;\n  align-items: center;\n  gap: 32px;\n  padding: 0 32px;\n  height: 44px;\n}\n.header__utility a {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 14px;\n  font-weight: 500;\n  color: var(--c-primary-400);\n  text-decoration: none;\n  padding: 6px 8px;\n  border-radius: var(--r-sm);\n}\n.header__utility a:hover {\n  text-decoration: underline;\n  text-underline-offset: 3px;\n}\n.header__utility a:focus-visible {\n  outline: 2px solid var(--c-primary-500);\n  outline-offset: 2px;\n}\n.header__utility .ext-icon {\n  width: 14px;\n  height: 14px;\n  flex-shrink: 0;\n}\n\n/* main bar */\n.header__main {\n  display: flex;\n  align-items: center;\n  gap: 48px;\n  padding: 24px 32px;\n  background: var(--c-bg);\n}\n.header--compact .header__main { padding: 14px 32px; }\n\n.header__nav {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  flex: 1 1 auto;\n  margin-left: 16px;\n}\n.header__actions {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  margin-left: auto;\n}\n\n/* nav link */\n.nav-link {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  padding: 8px 12px;\n  font-size: 17px;\n  font-weight: 500;\n  color: var(--c-primary-400);\n  text-decoration: none;\n  border-radius: var(--r-sm);\n  cursor: pointer;\n  background: transparent;\n  border: none;\n  font-family: inherit;\n}\n.nav-link:hover {\n  color: var(--c-primary-900);\n  text-decoration: underline;\n  text-underline-offset: 4px;\n  text-decoration-thickness: 2px;\n}\n.nav-link:focus-visible {\n  outline: 2px solid var(--c-primary-500);\n  outline-offset: 2px;\n}\n.nav-link[aria-current=\"page\"] {\n  color: var(--c-primary-900);\n  font-weight: 700;\n}\n.nav-link[aria-current=\"page\"]::after {\n  content: \"\";\n  position: absolute;\n  left: 12px;\n  right: 12px;\n  bottom: -10px;\n  height: 4px;\n  background: var(--c-primary-900);\n  border-radius: 2px 2px 0 0;\n}\n.header--compact .nav-link[aria-current=\"page\"]::after { bottom: -6px; }\n.nav-link__chev { width: 12px; height: 12px; }\n\n/* primary button (Log in) */\n.btn-primary {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 18px;\n  background: var(--c-primary-900);\n  color: white;\n  border: 2px solid var(--c-primary-900);\n  border-radius: var(--r-sm);\n  font-weight: 700;\n  font-size: 15px;\n  font-family: inherit;\n  cursor: pointer;\n  text-decoration: none;\n}\n.btn-primary:hover {\n  background: rgb(13, 50, 92);\n  border-color: rgb(13, 50, 92);\n}\n.btn-primary:focus-visible {\n  outline: 2px solid var(--c-primary-500);\n  outline-offset: 2px;\n}\n\n/* link button (Save & exit, Back) */\n.btn-link {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 10px 12px;\n  background: transparent;\n  color: var(--c-primary-400);\n  border: none;\n  border-radius: var(--r-sm);\n  font-weight: 500;\n  font-size: 15px;\n  font-family: inherit;\n  text-decoration: underline;\n  text-underline-offset: 3px;\n  cursor: pointer;\n}\n.btn-link:hover { color: var(--c-primary-900); text-decoration-thickness: 2px; }\n.btn-link:focus-visible {\n  outline: 2px solid var(--c-primary-500);\n  outline-offset: 2px;\n}\n\n/* hollow icon button */\n.icon-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 44px;\n  height: 44px;\n  background: transparent;\n  color: var(--c-primary-900);\n  border: 2px solid var(--c-primary-900);\n  border-radius: var(--r-sm);\n  cursor: pointer;\n  padding: 0;\n}\n.icon-btn:hover { background: var(--c-primary-50); }\n.icon-btn[aria-expanded=\"true\"] {\n  background: var(--c-primary-900);\n  color: white;\n}\n.icon-btn:focus-visible {\n  outline: 2px solid var(--c-primary-500);\n  outline-offset: 2px;\n}\n.icon-btn svg { width: 22px; height: 22px; }\n\n/* user menu trigger (auth) */\n.user-trigger {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 6px 10px 6px 6px;\n  background: transparent;\n  color: var(--c-primary-900);\n  border: 2px solid transparent;\n  border-radius: var(--r-sm);\n  cursor: pointer;\n  font-family: inherit;\n  font-weight: 500;\n  font-size: 15px;\n}\n.user-trigger:hover { background: var(--c-primary-50); border-color: var(--c-line); }\n.user-trigger[aria-expanded=\"true\"] {\n  background: var(--c-primary-50);\n  border-color: var(--c-primary-900);\n}\n.user-trigger:focus-visible {\n  outline: 2px solid var(--c-primary-500);\n  outline-offset: 2px;\n}\n.user-trigger__avatar {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background: var(--c-primary-900);\n  color: white;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  font-weight: 700;\n  font-size: 14px;\n  letter-spacing: 0.02em;\n}\n.user-trigger__name { line-height: 1.1; }\n.user-trigger__chev { width: 14px; height: 14px; transition: transform 0.18s ease; }\n.user-trigger[aria-expanded=\"true\"] .user-trigger__chev { transform: rotate(180deg); }\n\n/* dropdown menu */\n.menu {\n  position: absolute;\n  top: calc(100% + 6px);\n  right: 0;\n  min-width: 280px;\n  background: var(--c-bg);\n  border: 1px solid var(--c-line);\n  border-top: 4px solid var(--c-primary-900);\n  border-radius: var(--r-sm);\n  box-shadow: var(--shadow-menu);\n  padding: 8px;\n  z-index: 30;\n}\n.menu__group { padding: 8px 0; border-bottom: 1px solid var(--c-line); }\n.menu__group:last-child { border-bottom: none; }\n.menu__label {\n  padding: 4px 12px 8px;\n  font-size: 12px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  color: var(--c-ink-500);\n}\n.menu__item {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 12px;\n  border-radius: var(--r-sm);\n  color: var(--c-primary-900);\n  text-decoration: none;\n  font-size: 15px;\n  font-weight: 500;\n  cursor: pointer;\n  border: none;\n  background: transparent;\n  width: 100%;\n  text-align: left;\n  font-family: inherit;\n}\n.menu__item:hover { background: var(--c-primary-50); }\n.menu__item:focus-visible {\n  outline: 2px solid var(--c-primary-500);\n  outline-offset: -2px;\n}\n.menu__item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--c-primary-400); }\n.menu__item--danger { color: var(--c-coral); }\n.menu__item--danger svg { color: var(--c-coral); }\n\n/* user identity card at top of menu */\n.menu__identity {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 12px;\n  background: var(--c-primary-25);\n  border-radius: var(--r-sm);\n  margin-bottom: 4px;\n}\n.menu__identity-avatar {\n  width: 40px; height: 40px;\n  border-radius: 50%;\n  background: var(--c-primary-900);\n  color: white;\n  display: flex; align-items: center; justify-content: center;\n  font-weight: 700; font-size: 15px;\n}\n.menu__identity-name { font-weight: 700; font-size: 16px; color: var(--c-primary-900); line-height: 1.2; }\n.menu__identity-meta { font-size: 13px; color: var(--c-ink-500); margin-top: 2px; }\n\n/* mobile drawer */\n.mobile-drawer {\n  position: absolute;\n  top: 100%;\n  left: 0; right: 0;\n  background: var(--c-bg);\n  border-top: 1px solid var(--c-line);\n  box-shadow: var(--shadow-menu);\n  padding: 16px;\n  z-index: 25;\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n.mobile-drawer .nav-link {\n  font-size: 18px;\n  padding: 14px 16px;\n  border-radius: var(--r-sm);\n  justify-content: space-between;\n  width: 100%;\n}\n.mobile-drawer .nav-link[aria-current=\"page\"]::after { display: none; }\n.mobile-drawer .nav-link[aria-current=\"page\"] {\n  background: var(--c-primary-50);\n  border-left: 4px solid var(--c-primary-900);\n  padding-left: 12px;\n}\n.mobile-drawer__divider {\n  height: 1px;\n  background: var(--c-line);\n  margin: 8px 0;\n}\n.mobile-drawer__utility {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n.mobile-drawer__utility a {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 12px 16px;\n  font-size: 15px;\n  font-weight: 500;\n  color: var(--c-primary-400);\n  text-decoration: none;\n  border-radius: var(--r-sm);\n}\n.mobile-drawer__utility a:hover { background: var(--c-primary-25); }\n\n/* device frame for canvas */\n.device {\n  background: var(--c-primary-25);\n  border-radius: 8px;\n  padding: 24px;\n  display: flex;\n  align-items: flex-start;\n  justify-content: center;\n}\n.device--mobile { padding: 0; background: transparent; }\n.device__viewport {\n  background: white;\n  border: 1px solid var(--c-line);\n  overflow: hidden;\n  position: relative;\n}\n.device__viewport--mobile {\n  width: 375px;\n  border-radius: 24px;\n  border: 8px solid #1a1a1a;\n}\n.device__viewport--tablet {\n  width: 768px;\n  border-radius: 12px;\n}\n.device__viewport--desktop {\n  width: 100%;\n  border-radius: 8px;\n}\n\n/* page body placeholder under header */\n.page-body {\n  padding: 32px;\n  background: var(--c-primary-25);\n  min-height: 200px;\n  position: relative;\n}\n.page-body__placeholder {\n  background:\n    repeating-linear-gradient(\n      135deg,\n      rgba(19,66,118,0.05),\n      rgba(19,66,118,0.05) 6px,\n      transparent 6px,\n      transparent 14px\n    );\n  border: 1px dashed var(--c-ink-300);\n  border-radius: var(--r-sm);\n  padding: 40px;\n  text-align: center;\n  color: var(--c-ink-500);\n  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n  font-size: 13px;\n}\n\n/* wizard variant */\n.header--wizard {\n  border-bottom: 2px solid var(--c-ink-300);\n  box-shadow: none;\n}\n.header--wizard .header__main {\n  justify-content: space-between;\n  padding: 20px 48px;\n}\n.header--wizard .wizard-progress {\n  flex: 1 1 auto;\n  margin: 0 48px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n.wizard-progress__label {\n  display: flex;\n  justify-content: space-between;\n  font-size: 13px;\n  color: var(--c-ink-500);\n  font-weight: 500;\n}\n.wizard-progress__bar {\n  height: 8px;\n  background: var(--c-primary-100);\n  border-radius: var(--r-pill);\n  overflow: hidden;\n}\n.wizard-progress__fill {\n  height: 100%;\n  background: var(--c-primary-900);\n  border-radius: var(--r-pill);\n  transition: width 0.3s ease;\n}\n\n/* tablet adjustments */\n.header--tablet .header__nav { display: none; }\n.header--tablet .header__main { padding: 20px 32px; }\n\n/* mobile adjustments */\n.header--mobile .header__main { padding: 16px; gap: 12px; }\n.header--mobile .header__nav { display: none; }\n.header--mobile .header__utility { display: none; }\n.header--mobile .brand__wordmark { font-size: 18px; }\n.header--mobile .brand__symbol { width: 32px; height: 32px; }\n\n/* small chip for breakpoint label inside artboard */\n.bp-chip {\n  position: absolute;\n  top: 12px; left: 12px;\n  background: rgba(19, 66, 118, 0.92);\n  color: white;\n  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  padding: 4px 8px;\n  border-radius: var(--r-sm);\n  z-index: 5;\n}\n\n/* density */\n.dens-spacious .header__main { padding: 28px 32px; }\n.dens-spacious .header--compact .header__main { padding: 16px 32px; }\n.dens-cozy .header__main { padding: 20px 32px; }\n.dens-cozy .header--compact .header__main { padding: 12px 32px; }\n.dens-compact .header__main { padding: 14px 24px; }\n.dens-compact .header--compact .header__main { padding: 10px 24px; }\n.dens-compact .header__utility { height: 36px; padding: 0 24px; }\n.dens-compact .nav-link { padding: 6px 10px; font-size: 16px; }\n\n/* artboard internal spacing */\n.ab-pad {\n  padding: 0;\n}\n\n/* annotations */\n.annot {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n  font-size: 11px;\n  color: var(--c-ink-500);\n  margin-bottom: 8px;\n}\n.annot strong {\n  color: var(--c-primary-900);\n  font-family: var(--font-sans);\n  font-size: 13px;\n  font-weight: 700;\n}\n<\u002Fstyle>\n<script src=\"1f3eeecf-d34e-462c-9652-8125fcd6ef3d\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #F5FAFD; font-family: \"Atkinson Hyperlegible\", -apple-system, BlinkMacSystemFont, system-ui, \"Segoe UI\", sans-serif; }\n  a { color: #017AC9; } a:hover { color: #134276; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#F5FAFD;color:#333333;padding:40px 32px 64px;font-family:'Atkinson Hyperlegible',-apple-system,system-ui,sans-serif;\">\n\n  <div style=\"max-width:2080px;margin:0 auto 24px;display:flex;gap:8px;padding:6px;background:#E6F2FA;border-radius:999px;width:fit-content;\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"padding:12px 28px;border-radius:999px;border:2px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:18px;line-height:1.33;font-weight:700;cursor:pointer;\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"max-width:2080px;margin:0 auto 32px;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-end;justify-content:space-between;\">\n    <div style=\"max-width:760px;\">\n      <div style=\"font-size:14px;line-height:1;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#35C0BA;margin-bottom:16px;\">Discovery artefact · Scope map<\u002Fdiv>\n      <h1 style=\"font-size:40px;line-height:1.05;font-weight:700;color:#134276;margin:0 0 12px;\">VD2 release scope map<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.55;margin:0;max-width:68ch;text-wrap:pretty;\">Capability cards plotted across the eight employer journey stages and four release horizons. Each card shows who acts and when it lands.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n      <sc-for list=\"{{ releaseChips }}\" as=\"r\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:104px;padding:12px 16px;border-radius:8px;border:2px solid {{ r.border }};background:{{ r.bg }};color:{{ r.fg }};cursor:pointer;font-family:inherit;text-align:left;\">\n          <span style=\"font-size:15px;line-height:1.4;font-weight:700;\">{{ r.label }}<\u002Fspan>\n          <span style=\"font-size:12px;line-height:1.6;font-weight:700;letter-spacing:0.04em;\">{{ r.count }} capabilities<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:2080px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:24px 40px;align-items:center;padding:16px 24px;background:#E6F2FA;border-radius:8px;\">\n    <span style=\"font-size:12px;line-height:1.6;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#134276;\">Actors<\u002Fspan>\n    <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"4\">\n      <span style=\"display:flex;align-items:center;gap:10px;font-size:16px;line-height:1.6;\">\n        <span style=\"width:14px;height:14px;border-radius:999px;background:{{ l.color }};flex:none;\"><\u002Fspan>\n        <strong style=\"font-weight:700;color:#134276;\">{{ l.name }}<\u002Fstrong>\n        <span style=\"color:#666666;\">{{ l.note }}<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"max-width:2080px;margin:0 auto;padding-bottom:8px;\">\n    <div style=\"min-width:2080px;width:100%;display:flex;flex-direction:column;gap:12px;\">\n\n      <div style=\"display:grid;grid-template-columns:200px repeat(8, minmax(220px, 1fr));gap:12px;align-items:stretch;\">\n        <div><\u002Fdiv>\n        <sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <div style=\"background:#134276;color:#FFFFFF;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n            <span style=\"font-size:12px;line-height:1.6;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;opacity:0.75;\">Stage {{ s.num }}<\u002Fspan>\n            <span style=\"font-size:20px;line-height:1.25;font-weight:700;\">{{ s.name }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:200px repeat(8, minmax(220px, 1fr));gap:12px;align-items:stretch;\">\n          <div style=\"border-radius:8px;padding:16px;background:#FFFFFF;border-left:6px solid {{ row.color }};box-shadow:0 4px 8px rgba(22,44,69,0.20);display:flex;flex-direction:column;gap:6px;justify-content:center;\">\n            <span style=\"font-size:24px;line-height:1.2;font-weight:700;color:#134276;\">{{ row.name }}<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.4;color:#666666;\">{{ row.blurb }}<\u002Fspan>\n            <span style=\"font-size:12px;line-height:1.6;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:{{ row.color }};\">{{ row.count }} shown<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"8\">\n            <div style=\"border-radius:8px;background:rgba(255,255,255,0.55);border:1px dashed #BFDEF1;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:96px;\">\n              <sc-for list=\"{{ cell.cards }}\" as=\"c\" hint-placeholder-count=\"1\">\n                <div style=\"border-radius:8px;background:#FFFFFF;border:1px solid #E6F2FA;border-left:5px solid {{ c.color }};box-shadow:0 4px 8px rgba(22,44,69,0.20);padding:12px 14px;display:flex;flex-direction:column;gap:6px;opacity:{{ c.op }};\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;\">\n                    <span style=\"font-size:12px;line-height:1.6;font-weight:700;letter-spacing:0.06em;color:#666666;\">{{ c.id }}<\u002Fspan>\n                    <span style=\"font-size:12px;line-height:1;font-weight:700;letter-spacing:0.06em;padding:5px 9px;border-radius:999px;background:{{ c.pillBg }};color:{{ c.pillFg }};\">{{ c.release }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size:16px;line-height:1.4;color:#333333;text-wrap:pretty;\">{{ c.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ cell.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:15px;line-height:1.4;color:#8FA5BC;padding:6px 4px;\">No capability<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:2080px;margin:48px auto 0;\">\n    <h2 style=\"font-size:32px;line-height:1.15;font-weight:700;color:#134276;margin:0 0 8px;\">Release horizons<\u002Fh2>\n    <p style=\"font-size:18px;line-height:1.55;margin:0 0 24px;max-width:70ch;text-wrap:pretty;\">What each release adds on top of the last.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:16px;\">\n      <sc-for list=\"{{ horizons }}\" as=\"h\" hint-placeholder-count=\"4\">\n        <div style=\"background:#FFFFFF;border-radius:16px;border-top:6px solid {{ h.color }};box-shadow:0 4px 8px rgba(22,44,69,0.20);padding:24px;display:flex;flex-direction:column;gap:12px;\">\n          <span style=\"font-size:12px;line-height:1.6;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:{{ h.color }};\">{{ h.tag }} · {{ h.count }} capabilities<\u002Fspan>\n          <span style=\"font-size:24px;line-height:1.2;font-weight:700;color:#134276;\">{{ h.name }}<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.6;color:#333333;text-wrap:pretty;\">{{ h.desc }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst ACTORS = [\n  { key: 'employer', name: 'Employers', color: '#3A54A1', blurb: 'Employer actions and capabilities' },\n  { key: 'staff', name: 'MSD staff', color: '#FA7F14', blurb: 'Staff review, verification and support' },\n  { key: 'jobseeker', name: 'Jobseekers', color: '#F75C58', blurb: 'Jobseeker actions and open decisions' },\n  { key: 'system', name: 'Systems', color: '#017AC9', blurb: 'Core behaviours and integrations' }\n];\n\nconst STAGES = [\n  'Onboarding via invite', 'Access & onboarding', 'Employer profile & portal', 'Manage vacancies',\n  'Document management', 'Applications & referrals', 'Employer recruitment', 'Outcomes & support'\n];\n\nconst RELEASES = {\n  R1: { color: '#134276', name: 'Controlled pilot', desc: 'Foundational access for a small, trusted cohort of employers to create, submit and publish standard non-immigration vacancies, with initial staff review controls and basic jobseeker CV submission.' },\n  R2: { color: '#017AC9', name: 'Client applications & self-service expansion', desc: 'Open portal self-registration, user profile and preference management, bulk invite campaigns, and streamlined direct applications attached to candidate CVs.' },\n  R3: { color: '#35C0BA', name: 'Application & user management', desc: 'End-to-end recruitment management: shortlist or decline applicants, manage additional portal user roles, view organisational compliance, and submit support enquiries.' },\n  R4: { color: '#3A54A1', name: 'Full foundational & advanced capabilities', desc: 'Immigration vacancy handling, automated NZBN employer verification, help guidance, and pre-vacancy jobseeker discovery searching across all channels.' }\n};\n\nconst I = (id, label, actor, stage, release) => ({ id, label, actor, stage, release });\n\nconst ITEMS = [\n  I('F-001', 'Receive employer portal invite', 'employer', 1, 'R1'),\n  I('F-002', 'Invite employer', 'staff', 1, 'R1'),\n  I('F-001', 'Deliver controlled invitation and entry link', 'system', 1, 'R1'),\n  I('F-003', 'Send bulk invite campaign', 'staff', 1, 'R2'),\n\n  I('F-007', 'User account creation', 'employer', 2, 'R1'),\n  I('F-008', 'Account access recovery', 'employer', 2, 'R1'),\n  I('F-014', 'Accept terms, conditions and privacy notice', 'employer', 2, 'R1'),\n  I('F-009', 'Register for portal self-service', 'employer', 2, 'R2'),\n  I('F-010', 'Register company and core contacts', 'staff', 2, 'R1'),\n  I('F-011', 'Verify employer', 'staff', 2, 'R1'),\n  I('F-005', 'Browse public landing-page content', 'jobseeker', 2, 'R1'),\n  I('F-006', 'CIAM authentication and identity service', 'system', 2, 'R1'),\n  I('F-013', 'Landing-page content management integration', 'system', 2, 'R1'),\n  I('—', 'Automated NZBN employer verification integration', 'system', 2, 'R4'),\n\n  I('F-019', 'Authenticated homepage / dashboard view', 'employer', 3, 'R1'),\n  I('F-016', 'View and edit user profile', 'employer', 3, 'R2'),\n  I('F-017', 'View and edit contact preferences', 'employer', 3, 'R2'),\n  I('F-018', 'View and edit organisation profile', 'employer', 3, 'R2'),\n  I('F-020', 'Manage and invite additional users', 'employer', 3, 'R3'),\n  I('F-027', 'Suspend or deactivate employers', 'staff', 3, 'R1'),\n  I('F-028', 'Set relationship manager assignment', 'staff', 3, 'R1'),\n  I('F-026', 'Maintain enterprise data', 'staff', 3, 'R2'),\n  I('F-029', 'View organisation compliance', 'staff', 3, 'R3'),\n  I('F-032', 'Navigation and portal structure routing', 'system', 3, 'R1'),\n\n  I('F-035', 'Create vacancy', 'employer', 4, 'R1'),\n  I('F-036', 'Submit vacancy into review', 'employer', 4, 'R1'),\n  I('F-037', 'View vacancy lifecycle status', 'employer', 4, 'R1'),\n  I('F-038', 'Save draft and resume vacancy', 'employer', 4, 'R1'),\n  I('F-050', 'Review vacancies for completeness and suitability', 'staff', 4, 'R1'),\n  I('F-051', 'Publish approved vacancy', 'staff', 4, 'R1'),\n  I('—', 'Pre-vacancy discovery: indicative jobseeker availability search', 'jobseeker', 4, 'R4'),\n  I('F-044', 'Vacancy lifecycle workflow state transitions', 'system', 4, 'R1'),\n  I('F-045', 'Vacancy quality assurance rules', 'system', 4, 'R1'),\n  I('F-046', 'Trigger operational email notifications', 'system', 4, 'R1'),\n  I('SVD-993', 'Immigration vacancy submission handling', 'system', 4, 'R2'),\n\n  I('SVD-958', 'Client CV upload and storage', 'employer', 5, 'R1'),\n  I('F-057', 'Upload CV and supporting documents', 'jobseeker', 5, 'R1'),\n  I('F-074', 'Secure document storage and virus inspection', 'system', 5, 'R1'),\n\n  I('F-064', 'View direct vacancy applications', 'employer', 6, 'R1'),\n  I('F-065', 'Receive applicant email notifications', 'employer', 6, 'R1'),\n  I('SVD-986', 'Manual client referrals (view only)', 'staff', 6, 'R1'),\n  I('F-058', 'Apply directly for job', 'jobseeker', 6, 'R1'),\n  I('F-073', 'Application lifecycle workflow engine', 'system', 6, 'R1'),\n\n  I('F-077', 'Shortlist applicants', 'employer', 7, 'R1'),\n  I('F-078', 'Decline applicants', 'employer', 7, 'R1'),\n  I('F-079', 'Filter and sort applicants / applications', 'employer', 7, 'R1'),\n  I('F-099', 'Send recruitment activity status emails', 'system', 7, 'R1'),\n\n  I('F-085', 'Record recruitment outcome', 'employer', 8, 'R1'),\n  I('F-086', 'Close vacancy', 'employer', 8, 'R1'),\n  I('F-087', 'Request support enquiry', 'employer', 8, 'R2'),\n  I('F-088', 'View status of support enquiries', 'employer', 8, 'R2'),\n  I('F-089', 'View employer help guidance content', 'employer', 8, 'R3'),\n  I('F-091', 'Audit and compliance review', 'staff', 8, 'R1'),\n  I('F-092', 'Support enquiry status and queue management', 'staff', 8, 'R2'),\n  I('F-090', 'Receive outcome notification email', 'jobseeker', 8, 'R1'),\n  I('F-096', 'Operational volume and outcome reporting', 'system', 8, 'R1'),\n  I('F-097', 'System action audit logging', 'system', 8, 'R1')\n];\n\nconst RNAME = { R1: '1.1', R2: '1.2', R3: '1.3', R4: '1.4' };\n\nclass Component extends DCLogic {\n  state = { focus: 'all', view: 'user' };\n\n  renderVals() {\n    const focus = this.state.focus;\n    const view = this.state.view;\n    const keys = ['R1', 'R2', 'R3', 'R4'];\n    const set = (v) => this.setState({ focus: v });\n\n    const tabs = [\n      { id: 'user', label: 'By user' },\n      { id: 'release', label: 'By release' }\n    ].map(t => ({\n      label: t.label,\n      bg: view === t.id ? '#FFFFFF' : 'transparent',\n      fg: view === t.id ? '#134276' : '#666666',\n      border: view === t.id ? '#017AC9' : 'transparent',\n      onClick: () => this.setState({ view: t.id, focus: 'all' })\n    }));\n\n    const releaseChips = [{\n      label: view === 'user' ? 'All releases' : 'All users',\n      count: ITEMS.length,\n      bg: focus === 'all' ? '#134276' : '#FFFFFF',\n      fg: focus === 'all' ? '#FFFFFF' : '#134276',\n      border: '#134276',\n      onClick: () => set('all')\n    }].concat(\n      view === 'user'\n        ? keys.map(k => ({\n            label: 'Release ' + RNAME[k],\n            count: ITEMS.filter(i => i.release === k).length,\n            bg: focus === k ? RELEASES[k].color : '#FFFFFF',\n            fg: focus === k ? '#FFFFFF' : '#134276',\n            border: RELEASES[k].color,\n            onClick: () => set(k)\n          }))\n        : ACTORS.map(a => ({\n            label: a.name,\n            count: ITEMS.filter(i => i.actor === a.key).length,\n            bg: focus === a.key ? a.color : '#FFFFFF',\n            fg: focus === a.key ? '#FFFFFF' : '#134276',\n            border: a.color,\n            onClick: () => set(a.key)\n          }))\n    );\n\n    const card = (it) => {\n      const actor = ACTORS.find(a => a.key === it.actor);\n      const on = focus === 'all' || focus === (view === 'user' ? it.release : it.actor);\n      const pc = view === 'user' ? RELEASES[it.release].color : actor.color;\n      return {\n        id: it.id, label: it.label,\n        release: view === 'user' ? RNAME[it.release] : actor.name,\n        color: actor.color,\n        pillBg: on ? pc : '#E6F2FA',\n        pillFg: on ? '#FFFFFF' : '#666666',\n        op: on ? 1 : 0.22\n      };\n    };\n\n    const buildRow = (name, color, blurb, mine) => ({\n      name, color, blurb,\n      count: focus === 'all' ? mine.length : mine.filter(i => (view === 'user' ? i.release : i.actor) === focus).length,\n      cells: STAGES.map((_, si) => {\n        const cards = mine.filter(i => i.stage === si + 1).map(card);\n        return { cards, empty: cards.length === 0 };\n      })\n    });\n\n    const rows = view === 'user'\n      ? ACTORS.map(a => buildRow(a.name, a.color, a.blurb, ITEMS.filter(i => i.actor === a.key)))\n      : keys.map(k => buildRow('Release ' + RNAME[k], RELEASES[k].color, RELEASES[k].name, ITEMS.filter(i => i.release === k)));\n\n    return {\n      releaseChips, rows, tabs,\n      legend: ACTORS.map(a => ({ name: a.name, color: a.color, note: a.blurb })),\n      stages: STAGES.map((name, i) => ({ num: i + 1, name })),\n      horizons: keys.map(k => ({\n        tag: 'Release ' + RNAME[k],\n        name: RELEASES[k].name, desc: RELEASES[k].desc, color: RELEASES[k].color,\n        count: ITEMS.filter(i => i.release === k).length\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
